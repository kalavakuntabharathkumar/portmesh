<!doctype html>
<html>
<head><meta charset="utf-8"><title>Portfolio Dashboard</title>
<style>body{font-family:Arial;max-width:900px;margin:40px auto;padding:0 20px} .card{border:1px solid #ddd;border-radius:10px;padding:20px;margin:12px 0} table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left}button{padding:10px 16px}</style>
</head>
<body>
<h1>Portfolio Dashboard</h1>
<div class="card"><button onclick="loadData()">Refresh Portfolio</button><h2 id="total">Loading...</h2><div id="allocation"></div></div>
<div class="card"><h2>Holdings</h2><table><thead><tr><th>Asset</th><th>Quantity</th><th>Price</th><th>Value</th></tr></thead><tbody id="rows"></tbody></table></div>
<script>
async function loadData(){
  const r=await fetch('http://localhost:8001/portfolios/1/valuation');
  const d=await r.json();
  document.getElementById('total').textContent='Portfolio Value: $'+d.total_value.toLocaleString();
  document.getElementById('rows').innerHTML=d.positions.map(p=>`<tr><td>${p.symbol}</td><td>${p.quantity}</td><td>$${p.price}</td><td>$${p.value.toLocaleString()}</td></tr>`).join('');
  document.getElementById('allocation').textContent='Allocation: '+d.positions.map(p=>p.symbol+' '+(p.value/d.total_value*100).toFixed(1)+'%').join(' | ');
}
loadData();
</script>
</body></html>
